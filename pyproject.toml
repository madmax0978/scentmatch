[project]
name = "scentmatch"
version = "0.3.0"
description = "ScentMatch: note-aware perfume recommendation with NLGCL graph contrastive learning"
requires-python = ">=3.10,<3.13"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
