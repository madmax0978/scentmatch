# ScentMatch default configuration (Week 3: values chosen on the VALIDATION split, see
# reports/sweeps/*.csv; the test split was used once, at the end)
paths:
  raw_dir: data/raw
  vocab_dir: data/vocab
  processed_dir: data/processed
  checkpoints_dir: checkpoints
  db_path: data/scentmatch.db

data:
  fragrance_category: "Fragrance"
  positive_threshold: 4.0      # rating >= 4 -> positive; 1-3 stars are read in scentmatch.data.feedback
  k_core: 3                    # users and items with >= 3 positives (iterative)
  min_note_freq: 20            # Parfumo notes appearing in >= 20 perfumes enter the vocabulary

model:
  embedding_size: 64
  n_layers: 2                  # L (sweep: 1, 2, 3)
  cl_layers: 2                 # G <= L neighbour-layer pairs used in the contrastive loss
  cl_temp: 0.1                 # tau
  cl_weight: 1.0e-5            # lambda_1 (sweep: 0 = LightGCN, 1e-5 ... 1e-3; >= 2e-4 stops learning)
  reg_weight: 0.1              # lambda_2 (sweep: 1e-4 ... 0.2; Week 2 used 1e-4 and overfitted)
  alpha: 0.6                   # user-side vs item-side weight (official NLGCL code)
  use_notes: true              # user-perfume-note graph (the innovation; helps the quiz path)
  note_edge_weight: 0.3        # weight of perfume-note edges (sweep: 1, 0.3, 0.1)
  note_cl_weight: 1.0e-5       # lambda_note, contrastive loss on perfume-note pairs (sweep: 0, 1e-5, 5e-5)
  max_notes_per_item: 0        # notes v2 option: keep only the k most distinctive notes per perfume
                               # (0 = all). FROZEN at 0 (Week 3, validation): k = 3 ties on known users
                               # (NDCG@10 0.0694 vs 0.0695) and covers more (43.7% vs 38.7%), but loses
                               # 18% NDCG@10 on the quiz path (0.0406 vs 0.0498) - reports/WEEK3_NOTES_V2.md

train:
  epochs: 80
  batch_size: 1024             # 4096 (paper) gave only 13 steps/epoch on our data
  lr: 5.0e-3
  eval_every: 1
  early_stop_patience: 5
  seed: 3                      # served model = seed 3 of the final runs (best validation NDCG)
  dislike_neg_prob: 0.0        # P(negative = a perfume disliked in a review); tested 0.3/0.6, no gain
  rescued_positives: true      # add 1-3 star reviews that praise the smell as positives (+1.3% val NDCG)

serving:
  checkpoint: final_nlgcl_notes_rescued_s3.pt   # = python -m scentmatch.train.train --run-name ...
